when:
  - event: push
    branch:
      - main
      - development

steps:
  - name: gitleaks
    image: ghcr.io/gitleaks/gitleaks:latest
    commands:
      - gitleaks detect --source . --redact -v

  - name: build-and-push
    image: quay.io/buildah/stable
    privileged: true
    backend_options:
      kubernetes:
        securityContext:
          privileged: true
    environment:
      STORAGE_DRIVER: vfs
    commands:
      - export TAG=${CI_COMMIT_SHA:0:12}
      - export REG=192.168.0.202:5000
      - buildah bud -f docker/Dockerfile.dev -t $REG/isochrone-app:$TAG .
      - buildah push --tls-verify=false $REG/isochrone-app:$TAG

  - name: trivy-scan
    image: aquasec/trivy:latest
    commands:
      - export TAG=${CI_COMMIT_SHA:0:12}
      - export REG=192.168.0.202:5000
      - trivy image --insecure --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed $REG/isochrone-app:$TAG

  - name: cleanup-old-images
    image: alpine:latest
    commands:
      - apk add --no-cache curl jq
      - export REG=192.168.0.202:5000
      - export REPO=isochrone-app
      - export KEEP=2
      # Fetch all tags
      - TAGS=$(curl -sk https://$REG/v2/$REPO/tags/list | jq -r '.tags[]')
      # For each tag, get its creation date from the manifest and sort
      - |
        TAG_DATES=""
        for TAG in $TAGS; do
          DIGEST=$(curl -sk -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            https://$REG/v2/$REPO/manifests/$TAG \
            | jq -r '.config.digest // empty')
          if [ -z "$DIGEST" ]; then continue; fi
          CREATED=$(curl -sk https://$REG/v2/$REPO/blobs/$DIGEST \
            | jq -r '.created // empty')
          if [ -z "$CREATED" ]; then continue; fi
          TAG_DATES="$TAG_DATES $CREATED $TAG"
        done
      # Sort by date, drop the newest $KEEP, delete the rest
      - |
        SORTED=$(echo $TAG_DATES | xargs -n2 | sort -r | awk '{print $2}')
        TO_DELETE=$(echo "$SORTED" | tail -n +$(($KEEP + 1)))
        if [ -z "$TO_DELETE" ]; then
          echo "Nothing to delete."
          exit 0
        fi
        for TAG in $TO_DELETE; do
          echo "Deleting tag: $TAG"
          DIGEST=$(curl -sk -I \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            https://$REG/v2/$REPO/manifests/$TAG \
            | grep -i docker-content-digest | awk '{print $2}' | tr -d '\r')
          if [ -z "$DIGEST" ]; then
            echo "Could not get digest for $TAG, skipping."
            continue
          fi
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X DELETE \
            https://$REG/v2/$REPO/manifests/$DIGEST)
          echo "DELETE $TAG ($DIGEST) -> HTTP $STATUS"
        done

  - name: update-gitops-tag
    when:
      - event: push
        branch: main
    image: alpine:latest
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache git yq
      - export TAG=${CI_COMMIT_SHA:0:12}
      - git clone https://$GITHUB_TOKEN@github.com/Yibbzz/homelab-gitops.git /tmp/gitops
      - cd /tmp/gitops/homelab-gitops
      - yq -i ".image.tag = \"$TAG\"" apps/isochrone/dev.yaml
      - git config user.email "woodpecker@ci"
      - git config user.name "Woodpecker CI"
      - git add apps/isochrone/dev.yaml
      - 'git commit -m "chore: deploy isochrone $TAG [skip ci]"'
      - git push origin main