when:
  - event: push
    branch:
      - main
      - development

steps:
  - name: gitleaks
    image: ghcr.io/gitleaks/gitleaks:latest
    commands:
      - gitleaks detect --source . --redact -v

  - name: build-and-push
    image: quay.io/buildah/stable
    privileged: true
    backend_options:
      kubernetes:
        securityContext:
          privileged: true
    environment:
      STORAGE_DRIVER: vfs
    commands:
      - export TAG=${CI_COMMIT_SHA:0:12}
      - export REG=k3d-k3d-registry.localhost:5000
      - buildah bud -f docker/Dockerfile.dev -t $REG/isochrone-app:$TAG .
      - buildah push --tls-verify=false $REG/isochrone-app:$TAG

  - name: trivy-scan
    image: aquasec/trivy:latest
    commands:
      - export TAG=${CI_COMMIT_SHA:0:12}
      - export REG=k3d-k3d-registry.localhost:5000
      - trivy image --insecure --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed $REG/isochrone-app:$TAG

  - name: cleanup-old-images
    image: alpine:latest
    commands:
      - apk add --no-cache curl jq
      - export REG=k3d-k3d-registry.localhost:5000
      - export REPO=isochrone-app
      - export KEEP=2
      - |
        TAGS=$(curl -sk http://$REG/v2/$REPO/tags/list | jq -r '.tags[]')
        TAG_DATES=""
        for TAG in $TAGS; do
          # Only process 12-char hex SHA tags, skip 'development' etc
          if ! echo "$TAG" | grep -qE '^[0-9a-f]{12}$'; then
            echo "Skipping $TAG"
            continue
          fi

          DIGEST=$(curl -sk \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            http://$REG/v2/$REPO/manifests/$TAG \
            | jq -r '.config.digest // empty')
          if [ -z "$DIGEST" ]; then echo "$TAG -> no digest, skipping"; continue; fi

          CREATED=$(curl -sk http://$REG/v2/$REPO/blobs/$DIGEST \
            | jq -r '.created // empty')
          if [ -z "$CREATED" ]; then echo "$TAG -> no date, skipping"; continue; fi

          echo "$CREATED $TAG"
          TAG_DATES="$TAG_DATES\n$CREATED $TAG"
        done

        SORTED=$(printf "$TAG_DATES" | grep -v '^$' | sort -r | awk '{print $2}')
        TO_DELETE=$(echo "$SORTED" | tail -n +$(($KEEP + 1)))

        if [ -z "$TO_DELETE" ]; then
          echo "Nothing to delete."
          exit 0
        fi

        for TAG in $TO_DELETE; do
          echo "Deleting $TAG..."
          MANIFEST_DIGEST=$(curl -sk -I \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            http://$REG/v2/$REPO/manifests/$TAG \
            | grep -i docker-content-digest | awk '{print $2}' | tr -d '\r')

          if [ -z "$MANIFEST_DIGEST" ]; then
            echo "Could not get manifest digest for $TAG, skipping."
            continue
          fi

          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X DELETE \
            http://$REG/v2/$REPO/manifests/$MANIFEST_DIGEST)
          echo "DELETE $TAG ($MANIFEST_DIGEST) -> HTTP $STATUS"
        done

  - name: update-gitops-tag
    when:
      - event: push
        branch: main
    image: alpine:latest
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache git yq
      - export TAG=${CI_COMMIT_SHA:0:12}
      - git clone https://$GITHUB_TOKEN@github.com/Yibbzz/homelab-gitops.git /tmp/gitops
      - cd /tmp/gitops/homelab-gitops
      - yq -i ".image.tag = \"$TAG\"" apps/isochrone/dev.yaml
      - git config user.email "woodpecker@ci"
      - git config user.name "Woodpecker CI"
      - git add apps/isochrone/dev.yaml
      - 'git commit -m "chore: deploy isochrone $TAG [skip ci]"'
      - git push origin main